apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// ✅ 추가: google-services.json 읽게 해주는 플러그인
apply plugin: "com.google.gms.google-services"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def releaseStoreFilePath = project.findProperty("MANNABOM_UPLOAD_STORE_FILE") ?: System.getenv("MANNABOM_UPLOAD_STORE_FILE")
def releaseStorePassword = project.findProperty("MANNABOM_UPLOAD_STORE_PASSWORD") ?: System.getenv("MANNABOM_UPLOAD_STORE_PASSWORD")
def releaseKeyAlias = project.findProperty("MANNABOM_UPLOAD_KEY_ALIAS") ?: System.getenv("MANNABOM_UPLOAD_KEY_ALIAS")
def releaseKeyPassword = project.findProperty("MANNABOM_UPLOAD_KEY_PASSWORD") ?: System.getenv("MANNABOM_UPLOAD_KEY_PASSWORD")
def hasReleaseSigning = [
    releaseStoreFilePath,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
].every { value -> value != null && value.toString().trim() }

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.mannabom.app"
    defaultConfig {
        applicationId "com.mannabom.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [
            naverMapNcpKeyId: project.findProperty("NAVER_MAP_NCP_KEY_ID") ?: System.getenv("NAVER_MAP_NCP_KEY_ID") ?: ""
        ]
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // 업로드 키가 제공된 경우에만 서명합니다. debug 키로 운영 빌드를
            // 서명하지 않으며, 미설정 빌드는 스토어에 업로드할 수 없습니다.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    // 카카오 SDK
    implementation "com.kakao.sdk:v2-all:2.20.1"

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
